name: Build and Deploy Userscripts

on:
  push:
    branches: [ main ] # 每次你把代码 push 到 main 分支时触发

permissions:
  contents: read
  pages: write      # 赋予操作 GitHub Pages 的权限
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 安装项目依赖
      - name: Install dependencies
        run: npm install

      # 4. 运行打包脚本，生成 dist 目录
      - name: Build scripts
        run: npm run build

      # 5. 上传打包好的 dist 文件夹作为 Pages 产物
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      # 6. 正式部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4